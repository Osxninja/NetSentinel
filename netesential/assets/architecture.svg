<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#b83280" />
    </linearGradient>
    <filter id="boxGlow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      @keyframes dashFlow {
        from { stroke-dashoffset: 40; }
        to { stroke-dashoffset: 0; }
      }
      .flow-line {
        stroke-dasharray: 6, 6;
        animation: dashFlow 1.5s linear infinite;
      }
      .node-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 14px;
        fill: #f8fafc;
      }
      .node-desc {
        font-family: 'JetBrains Mono', Consolas, monospace;
        font-size: 11px;
        fill: #94a3b8;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" rx="16" fill="#04060a" stroke="#1e293b" stroke-width="1.5" />

  <!-- Flow Arrows connecting stages -->
  <!-- 1 to 2 -->
  <line x1="260" y1="120" x2="350" y2="120" stroke="#00f2fe" stroke-width="2" class="flow-line" />
  <polygon points="350,116 360,120 350,124" fill="#00f2fe" />

  <!-- 2 to 3 -->
  <line x1="590" y1="120" x2="680" y2="120" stroke="#00f2fe" stroke-width="2" class="flow-line" />
  <polygon points="680,116 690,120 680,124" fill="#00f2fe" />

  <!-- 3 to 4 (Downwards) -->
  <line x1="810" y1="210" x2="810" y2="280" stroke="#c084fc" stroke-width="2" class="flow-line" />
  <polygon points="806,280 810,290 814,280" fill="#c084fc" />

  <!-- 4 to 5 (Leftwards) -->
  <line x1="680" y1="365" x2="590" y2="365" stroke="#c084fc" stroke-width="2" class="flow-line" />
  <polygon points="590,361 580,365 590,369" fill="#c084fc" />

  <!-- 5 to 6 (Leftwards) -->
  <line x1="350" y1="365" x2="260" y2="365" stroke="#10b981" stroke-width="2" class="flow-line" />
  <polygon points="260,361 250,365 260,369" fill="#10b981" />

  <!-- Stage 1: Ingestion Layer -->
  <g transform="translate(40, 50)">
    <rect width="220" height="140" rx="10" fill="url(#boxGrad)" stroke="#00f2fe" stroke-width="1.5" filter="url(#boxGlow)" />
    <rect x="0" y="0" width="220" height="6" rx="3" fill="url(#neonCyan)" />
    <text x="20" y="34" class="node-title">1. ZERO-COPY INGESTION</text>
    <text x="20" y="62" class="node-desc">• libpcap / Scapy Sniffer</text>
    <text x="20" y="82" class="node-desc">• 0-Privilege Socket Fallback</text>
    <text x="20" y="102" class="node-desc">• BPF Kernel Filtering</text>
    <text x="20" y="122" class="node-desc">• Decoupled Queue Buffer</text>
  </g>

  <!-- Stage 2: SQLite WAL Batching -->
  <g transform="translate(360, 50)">
    <rect width="230" height="140" rx="10" fill="url(#boxGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="0" y="0" width="230" height="6" rx="3" fill="#38bdf8" />
    <text x="20" y="34" class="node-title">2. WAL PERSISTENCE</text>
    <text x="20" y="62" class="node-desc">• AsyncBatchWriter (aiosqlite)</text>
    <text x="20" y="82" class="node-desc">• Micro-Flush (500ms / 250 pkts)</text>
    <text x="20" y="102" class="node-desc">• High-Concurrency SQLite WAL</text>
    <text x="20" y="122" class="node-desc">• Zero Lock Contention</text>
  </g>

  <!-- Stage 3: Tri-Tier Detection Engine -->
  <g transform="translate(690, 50)">
    <rect width="230" height="160" rx="10" fill="url(#boxGrad)" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="0" y="0" width="230" height="6" rx="3" fill="#f59e0b" />
    <text x="20" y="34" class="node-title">3. TRI-TIER ANALYTICS</text>
    <text x="20" y="60" class="node-desc">• S1: Deterministic Heuristics</text>
    <text x="20" y="78" class="node-desc">  (PPS spike, Port Scan, Flags)</text>
    <text x="20" y="98" class="node-desc">• S2: MAD Modified Z-Score</text>
    <text x="20" y="116" class="node-desc">  (Poisson resilient dynamic base)</text>
    <text x="20" y="136" class="node-desc">• S3: Isolation Forest (ML)</text>
    <text x="20" y="152" class="node-desc">  (10D Multivariate Vectors)</text>
  </g>

  <!-- Stage 4: (EC)² Autonomous Multi-Agent Graph -->
  <g transform="translate(680, 290)">
    <rect width="240" height="150" rx="10" fill="url(#boxGrad)" stroke="#a855f7" stroke-width="1.5" filter="url(#boxGlow)" />
    <rect x="0" y="0" width="240" height="6" rx="3" fill="url(#neonPurple)" />
    <text x="20" y="34" class="node-title">4. (EC)² MULTI-AGENT RAG</text>
    <text x="20" y="62" class="node-desc">• 8 Specialized Agents</text>
    <text x="20" y="82" class="node-desc">• Stage A: Context Initiation</text>
    <text x="20" y="102" class="node-desc">• Stage B: 3-Hypothesis Cycle</text>
    <text x="20" y="122" class="node-desc">• Stage C: Grounded Review</text>
    <text x="20" y="140" class="node-desc">• Zero Hallucination Guarantee</text>
  </g>

  <!-- Stage 5: Grounding & Knowledge Graph -->
  <g transform="translate(360, 290)">
    <rect width="220" height="150" rx="10" fill="url(#boxGrad)" stroke="#818cf8" stroke-width="1.5" />
    <rect x="0" y="0" width="220" height="6" rx="3" fill="#818cf8" />
    <text x="20" y="34" class="node-title">5. EVIDENCE GROUNDING</text>
    <text x="20" y="62" class="node-desc">• Multi-hop Topology Graph</text>
    <text x="20" y="82" class="node-desc">• Read-Only SQLite SQL Tool</text>
    <text x="20" y="102" class="node-desc">• Automatic PII Redaction</text>
    <text x="20" y="122" class="node-desc">• Host Criticality Scoring</text>
  </g>

  <!-- Stage 6: Humanized Deliverables & SOC UI -->
  <g transform="translate(40, 290)">
    <rect width="210" height="150" rx="10" fill="url(#boxGrad)" stroke="#10b981" stroke-width="1.5" />
    <rect x="0" y="0" width="210" height="6" rx="3" fill="#10b981" />
    <text x="20" y="34" class="node-title">6. EXECUTIVE DELIVERABLE</text>
    <text x="20" y="62" class="node-desc">• Plain-English Forensic Triage</text>
    <text x="20" y="82" class="node-desc">• Streamlit SOC Web Dashboard</text>
    <text x="20" y="102" class="node-desc">• Wireshark-Style Packet Grid</text>
    <text x="20" y="122" class="node-desc">• One-Click PCAP Export</text>
  </g>
</svg>