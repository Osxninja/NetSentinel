<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070e" />
      <stop offset="50%" stop-color="#090d1a" />
      <stop offset="100%" stop-color="#0e1326" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 242, 254, 0.05)" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.08); }
      }
      @keyframes blip {
        0%, 100% { opacity: 0.2; r: 3; }
        50% { opacity: 1; r: 5; }
      }
      @keyframes livePulse {
        0%, 100% { opacity: 1; filter: drop-shadow(0 0 2px #00ff88); }
        50% { opacity: 0.4; filter: drop-shadow(0 0 8px #00ff88); }
      }
      @keyframes lineSlide {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      .radar-sweep {
        transform-origin: 850px 160px;
        animation: radarSweep 6s linear infinite;
      }
      .blip-1 { animation: blip 2.5s ease-in-out infinite; }
      .blip-2 { animation: blip 3.2s ease-in-out infinite 0.8s; }
      .blip-3 { animation: blip 1.8s ease-in-out infinite 1.4s; }
      .live-dot { animation: livePulse 1.8s infinite; }
      .glowing-bar {
        stroke-dasharray: 400;
        animation: lineSlide 3s ease-out infinite alternate;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="320" rx="16" fill="url(#bgGrad)" />
  <rect width="1000" height="320" rx="16" fill="url(#grid)" />
  <rect width="1000" height="320" rx="16" fill="none" stroke="rgba(0, 242, 254, 0.2)" stroke-width="1.5" />

  <!-- Top Cyber Status Bar -->
  <rect x="30" y="24" width="940" height="36" rx="8" fill="rgba(10, 16, 30, 0.8)" stroke="rgba(0, 242, 254, 0.15)" stroke-width="1" />
  <circle cx="50" cy="42" r="5" fill="#00ff88" class="live-dot" />
  <text x="66" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#00ff88" letter-spacing="1.5">ENGINE ACTIVE</text>
  <text x="220" y="46" font-family="monospace" font-size="12" fill="rgba(255, 255, 255, 0.5)">INGESTION: 10 Gbps ZERO-COPY</text>
  <text x="500" y="46" font-family="monospace" font-size="12" fill="rgba(255, 255, 255, 0.5)">DETECTION: TRI-TIER (RULES + MAD + ML)</text>
  <text x="820" y="46" font-family="monospace" font-size="12" font-weight="600" fill="#a855f7">RAG: (EC)² AGENTS</text>

  <!-- Main Banner Title & Subtitle -->
  <text x="45" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="900" fill="url(#textGrad)" filter="url(#glow)" letter-spacing="-0.5">NETSENTINEL</text>
  
  <text x="48" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" letter-spacing="0.2">
    Autonomous Network Anomaly Detection &amp; Multi-Agent Forensic Triage
  </text>
  
  <text x="48" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94a3b8">
    Zero-privilege live packet ingestion, two-stage analytics, and autonomous (EC)² directed graph investigations.
  </text>

  <!-- Animated Bottom Accent Divider -->
  <path d="M 48 220 L 680 220" stroke="url(#accentGrad)" stroke-width="2" class="glowing-bar" filter="url(#subtleGlow)" />

  <!-- Author & Security Lab Badges inside Banner -->
  <g transform="translate(48, 245)">
    <!-- Developer Pill -->
    <rect x="0" y="0" width="190" height="34" rx="6" fill="rgba(0, 242, 254, 0.08)" stroke="#00f2fe" stroke-width="1"/>
    <text x="14" y="21" font-family="monospace" font-size="11" fill="#94a3b8">DEVELOPER</text>
    <text x="94" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#ffffff">Hardik</text>

    <!-- Lab Pill -->
    <rect x="205" y="0" width="260" height="34" rx="6" fill="rgba(121, 40, 202, 0.1)" stroke="#a855f7" stroke-width="1"/>
    <text x="219" y="21" font-family="monospace" font-size="11" fill="#94a3b8">RESEARCH LAB</text>
    <text x="315" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#ffffff">Hidden Eye Security</text>

    <!-- GitHub Pill -->
    <rect x="480" y="0" width="220" height="34" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1"/>
    <text x="495" y="21" font-family="monospace" font-size="11" fill="#94a3b8">REPO</text>
    <text x="540" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#38bdf8">Osxninja/NetSentinel</text>
  </g>

  <!-- Interactive Cyber Radar Display (Right Hand Side) -->
  <g transform="translate(0, 0)">
    <circle cx="850" cy="160" r="90" fill="rgba(0, 242, 254, 0.02)" stroke="rgba(0, 242, 254, 0.15)" stroke-width="1.5" />
    <circle cx="850" cy="160" r="60" fill="none" stroke="rgba(0, 242, 254, 0.2)" stroke-width="1" stroke-dasharray="4,4" />
    <circle cx="850" cy="160" r="30" fill="none" stroke="rgba(0, 242, 254, 0.25)" stroke-width="1" />
    <line x1="850" y1="65" x2="850" y2="255" stroke="rgba(0, 242, 254, 0.1)" stroke-width="1" />
    <line x1="755" y1="160" x2="945" y2="160" stroke="rgba(0, 242, 254, 0.1)" stroke-width="1" />

    <!-- Animated Sweep Sector -->
    <g class="radar-sweep">
      <path d="M 850 160 L 940 160 A 90 90 0 0 0 913 96 Z" fill="url(#textGrad)" opacity="0.25" />
      <line x1="850" y1="160" x2="940" y2="160" stroke="#00f2fe" stroke-width="1.5" filter="url(#glow)" />
    </g>

    <!-- Detected Threat Blips -->
    <circle cx="880" cy="120" r="4" fill="#ef4444" class="blip-1" filter="url(#glow)" />
    <circle cx="820" cy="190" r="3" fill="#f59e0b" class="blip-2" />
    <circle cx="895" cy="175" r="3.5" fill="#00f2fe" class="blip-3" />
    <circle cx="850" cy="160" r="3" fill="#ffffff" />
    
    <text x="850" y="270" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8" letter-spacing="1">SURVEILLANCE RADAR</text>
  </g>
</svg>